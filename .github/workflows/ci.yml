name: CI Pipeline

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

jobs:
  # ------------------------------------------------------------------
  # Commitlint — always runs
  # ------------------------------------------------------------------
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  # ------------------------------------------------------------------
  # Path gate — checks which optional modules exist so downstream jobs
  # can skip themselves. hashFiles is valid at step-level if but NOT
  # at job-level if, so we emit outputs instead.
  # ------------------------------------------------------------------
  check-paths:
    needs: commitlint
    runs-on: ubuntu-latest
    outputs:
      has_frontend: ${{ steps.set-flags.outputs.has_frontend }}
      has_nlp: ${{ steps.set-flags.outputs.has_nlp }}
    steps:
      - uses: actions/checkout@v4
      - id: set-flags
        run: |
          if [ "$(ls -A frontend 2>/dev/null)" ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$(ls -A nlp-service 2>/dev/null)" ]; then
            echo "has_nlp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_nlp=false" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # Backend — Java 17 + Spring Boot 3
  # ------------------------------------------------------------------
  backend-lint:
    needs: check-paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip — no backend code yet
        if: hashFiles('backend/**') == ''
        run: exit 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Checkstyle
        working-directory: backend
        run: ./mvnw checkstyle:check

  backend-type-check:
    needs: check-paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip — no backend code yet
        if: hashFiles('backend/**') == ''
        run: exit 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile (type check)
        working-directory: backend
        run: ./mvnw compile

  backend-test:
    needs: [backend-lint, backend-type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip — no backend code yet
        if: hashFiles('backend/**') == ''
        run: exit 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run JUnit 5 tests
        working-directory: backend
        run: ./mvnw test

  # ------------------------------------------------------------------
  # Frontend — activates automatically when frontend/ exists
  # ------------------------------------------------------------------
  frontend-lint:
    needs: check-paths
    if: needs.check-paths.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oxc-project/oxlint-action@v2.0.1
        with:
          working-directory: frontend
          all-files: true

  frontend-type-check:
    needs: check-paths
    if: needs.check-paths.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-test:
    needs: [frontend-lint, frontend-type-check]
    if: needs.check-paths.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Jest tests
        working-directory: frontend
        run: npm test

  # ------------------------------------------------------------------
  # NLP Service — activates automatically when nlp-service/ exists
  # ------------------------------------------------------------------
  nlp-test:
    needs: check-paths
    if: needs.check-paths.outputs.has_nlp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        working-directory: nlp-service
        run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: nlp-service
        run: pytest

  # ------------------------------------------------------------------
  # Build — docker compose + backend jar
  # ------------------------------------------------------------------
  build:
    needs: [backend-test]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    env:
      # Use deterministic placeholders — compose config validation and jar
      # packaging don't need real API keys. Real keys are wired via .env at
      # runtime. Using placeholders here keeps forks portable.
      FINNHUB_KEY_NEWS: ci-placeholder
      FINNHUB_KEY_PRICE: ci-placeholder
      TWELVEDATA_API_KEY: ci-placeholder
      LLM_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Seed placeholder env
        run: cp .env.example .env
      - name: Verify Docker Compose config
        run: docker compose config --quiet
      - name: Build backend jar
        working-directory: backend
        run: ./mvnw package -DskipTests
