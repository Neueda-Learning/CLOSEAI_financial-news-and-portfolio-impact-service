name: CI Pipeline

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

jobs:
  # ------------------------------------------------------------------
  # HSBC scan — always runs, blocks any content containing the banned word
  # ------------------------------------------------------------------
  hsbc-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for banned content
        run: |
          if grep -rIi 'hsbc' --include='*' --exclude-dir='.git' --exclude='CLAUDE.md' --exclude='ReadMe.md' --exclude='ReadMe.zh-CN.md' --exclude='ci.yml' .; then
            echo "⛔ BANNED: 'HSBC' found in project files. Remove immediately."
            exit 1
          fi
          echo "✅ HSBC scan clean"

  # ------------------------------------------------------------------
  # Commitlint — always runs, checks ALL commits in the PR/push
  # ------------------------------------------------------------------
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.js

  # ------------------------------------------------------------------
  # Backend — Java 17 + Spring Boot 3
  # Activates when backend/ directory has code
  # ------------------------------------------------------------------
  backend-lint:
    needs: commitlint
    runs-on: ubuntu-latest
    if: hashFiles('backend/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Checkstyle
        working-directory: backend
        run: ./mvnw checkstyle:check

  backend-type-check:
    needs: commitlint
    runs-on: ubuntu-latest
    if: hashFiles('backend/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile (type check)
        working-directory: backend
        run: ./mvnw compile

  backend-test:
    needs: [backend-lint, backend-type-check]
    runs-on: ubuntu-latest
    if: hashFiles('backend/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run JUnit 5 tests
        working-directory: backend
        run: ./mvnw test

  # ------------------------------------------------------------------
  # Frontend — React
  # Activates when frontend/ directory has code
  # ------------------------------------------------------------------
  frontend-lint:
    needs: commitlint
    runs-on: ubuntu-latest
    if: hashFiles('frontend/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  frontend-type-check:
    needs: commitlint
    runs-on: ubuntu-latest
    if: hashFiles('frontend/tsconfig.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-test:
    needs: [frontend-lint, frontend-type-check]
    runs-on: ubuntu-latest
    if: hashFiles('frontend/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Jest tests
        working-directory: frontend
        run: npm test

  # ------------------------------------------------------------------
  # NLP Service — Python (finBERT)
  # Activates when nlp-service/ directory has code
  # ------------------------------------------------------------------
  nlp-test:
    needs: commitlint
    runs-on: ubuntu-latest
    if: hashFiles('nlp-service/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        working-directory: nlp-service
        run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: nlp-service
        run: pytest

  # ------------------------------------------------------------------
  # Build — verifies everything compiles together
  # ------------------------------------------------------------------
  build:
    needs: [backend-test, frontend-test, nlp-test]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose config
        run: docker compose config --quiet
      - name: Build backend jar (if present)
        if: hashFiles('backend/pom.xml') != ''
        working-directory: backend
        run: ./mvnw package -DskipTests
