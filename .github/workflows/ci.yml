name: CI Pipeline

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

jobs:
  # ------------------------------------------------------------------
  # Commitlint — always runs
  # ------------------------------------------------------------------
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  # ------------------------------------------------------------------
  # Backend — Java 17 + Spring Boot 3
  # ------------------------------------------------------------------
  backend-lint:
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip — no backend code yet
        if: hashFiles('backend/**') == ''
        run: exit 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Checkstyle
        working-directory: backend
        run: ./mvnw checkstyle:check

  backend-type-check:
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip — no backend code yet
        if: hashFiles('backend/**') == ''
        run: exit 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile (type check)
        working-directory: backend
        run: ./mvnw compile

  backend-test:
    needs: [backend-lint, backend-type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip — no backend code yet
        if: hashFiles('backend/**') == ''
        run: exit 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run JUnit 5 tests
        working-directory: backend
        run: ./mvnw test

  # ------------------------------------------------------------------
  # Frontend — activates automatically when frontend/ is created
  # ------------------------------------------------------------------
  # Skip frontend jobs until frontend files exist.
  frontend-lint:
    needs: commitlint
    if: hashFiles('frontend/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  frontend-type-check:
    needs: commitlint
    if: hashFiles('frontend/tsconfig.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-test:
    needs: [frontend-lint, frontend-type-check]
    if: hashFiles('frontend/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Jest tests
        working-directory: frontend
        run: npm test

  # ------------------------------------------------------------------
  # NLP Service — activates automatically when nlp-service/ is created
  # ------------------------------------------------------------------
  nlp-test:
    needs: commitlint
    if: hashFiles('nlp-service/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        working-directory: nlp-service
        run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: nlp-service
        run: pytest

  # ------------------------------------------------------------------
  # Build — docker compose + backend jar
  # ------------------------------------------------------------------
  build:
    needs: [backend-test]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    env:
      FINNHUB_KEY_NEWS: ${{ secrets.FINNHUB_KEY_NEWS }}
      FINNHUB_KEY_PRICE: ${{ secrets.FINNHUB_KEY_PRICE }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API }}
    steps:
      - uses: actions/checkout@v4
      - name: Seed placeholder env
        run: cp .env.example .env
      - name: Verify Docker Compose config
        run: docker compose config --quiet
      - name: Build backend jar
        working-directory: backend
        run: ./mvnw package -DskipTests
