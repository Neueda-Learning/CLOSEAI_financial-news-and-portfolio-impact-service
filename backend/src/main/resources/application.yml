server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fnpis-backend

  datasource:
    # connectionTimeZone=UTC is deliberate: Finnhub returns Unix timestamps,
    # US markets run on US/Eastern, users read the page in another zone.
    # All three mixed without a fixed baseline gets attribution dates wrong
    # (EC-16 / EC-17). Store UTC, convert in the presentation layer.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:fnpis}?connectionTimeZone=UTC&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:fnpis_user}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Flyway owns the schema. Hibernate must never alter it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Fail on boot if that directory goes missing, rather than starting against
    # an empty schema and failing later on the first query. Spring's default is
    # false, so this line is the protection - deleting it removes it.
    fail-on-missing-locations: true

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health, info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ---------------------------------------------------------------------------
# Application settings. Every value here is a knob the team agreed on in the
# architecture document - change the doc first, then this file.
# ---------------------------------------------------------------------------
app:
  # Flip any of these to the mock/stub implementation. On demo day this is the
  # fallback path when quota is gone or a provider is down (decision 1, 8.1).
  providers:
    news: ${PROVIDER_NEWS:finnhub}       # finnhub | mock
    price: ${PROVIDER_PRICE:finnhub}     # finnhub | mock
    sentiment: ${PROVIDER_SENTIMENT:agent}  # agent | stub

  sentiment:
    model: ${LLM_MODEL:}
    temperature: 0
    prompt-version: v1
    # Each article costs one LLM call, so cap parallelism (decision 5, cost 2)
    max-concurrency: 3

  impact:
    # Below this absolute price move the result is INCONCLUSIVE - the swing is
    # noise, not a reaction. Tunable before the demo (requirements 5.3).
    epsilon: 0.005

  schedule:
    # fixedDelay, not fixedRate: a run only starts after the previous one
    # finished, so a task can never overlap itself (EC-23).
    news-poll-delay: 900000      # 15 min
    quote-refresh-delay: 60000   # 1 min, trading hours only

finnhub:
  base-url: https://finnhub.io/api/v1
  # News and price use separate accounts so one hitting its quota cannot
  # starve the other. Rate limiters must be configured per key, not shared
  # (architecture 6.5 requirement 1).
  keys:
    news: ${FINNHUB_KEY_NEWS}
    price: ${FINNHUB_KEY_PRICE}

llm:
  api-key: ${LLM_API_KEY}
  base-url: ${LLM_BASE_URL:}

# No defaults on the three secrets above on purpose: a default value is the
# same risk surface as committing the key. Startup fails fast when one is
# missing, which beats collecting 401s minutes later (architecture 7.5).

# ---------------------------------------------------------------------------
# One rate limiter per key, never a shared instance. Sharing lets the news
# poll drain the limiter and get quote refreshes rejected as collateral, which
# defeats the whole point of holding separate keys (architecture 6.5 req 1).
# A 429 must degrade only its own chain (req 2).
# ---------------------------------------------------------------------------
resilience4j:
  ratelimiter:
    instances:
      finnhubNews:
        limit-for-period: 30
        limit-refresh-period: 60s
        timeout-duration: 0s
      finnhubPrice:
        limit-for-period: 30
        limit-refresh-period: 60s
        timeout-duration: 0s
      llmSentiment:
        limit-for-period: 20
        limit-refresh-period: 60s
        timeout-duration: 5s

  retry:
    instances:
      # Do not retry a 429. Retrying a rate limit makes it worse - fall back
      # to cached data and surface stale=true instead.
      externalApi:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true

  circuitbreaker:
    instances:
      finnhub:
        sliding-window-size: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
      llm:
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
